apiVersion: apps/v1
kind: Deployment
metadata:
  name: netguard
  labels:
    app.kubernetes.io/name: netguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: netguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netguard
    spec:
      containers:
        - name: api
          image: ghcr.io/kian-kianmehr/netguard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: CACHE_TTL_SECONDS
              value: "90"
            - name: SOURCE_TIMEOUT_SECONDS
              value: "5"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: netguard
spec:
  selector:
    app.kubernetes.io/name: netguard
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP