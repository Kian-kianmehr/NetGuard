<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a111d" />
    <meta name="description" content="نت‌گارد؛ پایش شفاف و مستند وضعیت اینترنت ایران بر پایهٔ داده‌های عمومی" />
    <meta name="color-scheme" content="dark" />
    <title>نت‌گارد | مرکز پایش اینترنت ایران</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root{color-scheme:dark;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#0a111d;color:#e8eef6}
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%;background:#0a111d}
      .boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 52% 36%,#132a36 0,transparent 48%),#0a111d}
      .boot-inner{width:min(100%,380px);text-align:center;display:grid;justify-items:center;gap:14px}
      .boot-mark{width:58px;height:58px;display:grid;place-items:center;border:1px solid #2c615e;border-radius:17px;background:#123238;color:#83e2c6;font-weight:850;letter-spacing:1px}
      .boot-inner strong{font-size:15px;letter-spacing:3px}
      .boot-inner p{margin:0;color:#9aabba;font-size:13px;line-height:2}
      .boot-bar{width:130px;height:3px;background:#243646;border-radius:4px;overflow:hidden}
      .boot-bar i{display:block;height:100%;width:35%;background:#79dec1;animation:load 1.3s ease-in-out infinite alternate}
      .boot-help{display:none;max-width:320px;color:#d9c39b;font-size:12px;line-height:1.9}
      .boot-retry{display:none;border:1px solid #45645e;background:#173532;color:#a6ebd6;border-radius:9px;padding:10px 18px;font:inherit;cursor:pointer}
      @keyframes load{to{transform:translateX(95px)}}
      @media(prefers-reduced-motion:reduce){.boot-bar i{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot" role="status" aria-live="polite">
        <div class="boot-inner">
          <div class="boot-mark">NG</div>
          <strong>NETGUARD</strong>
          <p>در حال راه‌اندازی مرکز پایش...</p>
          <div class="boot-bar"><i></i></div>
          <p class="boot-help" id="boot-help">برنامه در مرورگر اجرا نشد. اتصال را بررسی کن و برای تلاش دوباره صفحه را بارگذاری کن.</p>
          <button class="boot-retry" id="boot-retry" type="button">بارگذاری دوباره</button>
        </div>
      </main>
    </div>
    <script type="module" id="netguard-entry" src="/src/main.jsx"></script>
    <script>
      (function () {
        var entry = document.getElementById("netguard-entry");
        var retryCount = 0;
        var retryLimit = 2;

        function bootIsVisible() {
          return Boolean(document.querySelector("#root .boot"));
        }

        function showRecovery(message) {
          if (!bootIsVisible()) return;
          var help = document.getElementById("boot-help");
          var retry = document.getElementById("boot-retry");
          var bar = document.querySelector(".boot-bar");

          if (help) {
            help.textContent = message || "برنامه در مرورگر اجرا نشد. ممکن است دریافت فایل اصلی سایت در مسیر شبکه قطع شده باشد.";
            help.style.display = "block";
          }
          if (retry) {
            retry.style.display = "inline-block";
            retry.onclick = function () {
              var url = new URL(window.location.href);
              url.searchParams.set("ng-refresh", String(Date.now()));
              window.location.replace(url.href);
            };
          }
          if (bar) bar.style.display = "none";
        }

        function retryEntry() {
          if (!bootIsVisible()) return;
          if (retryCount >= retryLimit) {
            showRecovery("دریافت برنامه پس از چند تلاش ناموفق بود. اتصال را بررسی کن و دوباره صفحه را باز کن.");
            return;
          }

          retryCount += 1;
          window.setTimeout(function () {
            if (!bootIsVisible()) return;
            var retryScript = document.createElement("script");
            var retryUrl = new URL(entry.src, window.location.href);
            retryScript.type = "module";
            retryUrl.searchParams.set("ng-retry", String(retryCount));
            retryScript.src = retryUrl.href;
            retryScript.addEventListener("error", retryEntry, { once: true });
            document.body.appendChild(retryScript);
          }, retryCount * 700);
        }

        if (entry) entry.addEventListener("error", retryEntry, { once: true });

        window.addEventListener("error", function (event) {
          if (!bootIsVisible() || !event.message) return;
          showRecovery("خطای اجرای برنامه: " + String(event.message).slice(0, 180));
        }, true);

        window.addEventListener("unhandledrejection", function (event) {
          if (!bootIsVisible()) return;
          var reason = event.reason && event.reason.message
            ? event.reason.message
            : event.reason || "خطای Promise هنگام راه‌اندازی";
          showRecovery("خطای راه‌اندازی برنامه: " + String(reason).slice(0, 180));
        });

        window.setTimeout(function () {
          if (document.documentElement.dataset.netguardReady === "true" || !bootIsVisible()) return;
          showRecovery();
        }, 14000);
      })();
    </script>
  </body>
</html>
