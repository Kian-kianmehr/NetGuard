server {
    listen 10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Render health check: verify the reverse proxy can reach the live API.
    location = /api/health {
        proxy_pass https://netguard-api-oan9.onrender.com/health;
        proxy_ssl_server_name on;
        proxy_ssl_name netguard-api-oan9.onrender.com;
        proxy_set_header Host netguard-api-oan9.onrender.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    # Keep the legacy same-origin API paths working while using the
    # dedicated Frankfurt API service as the single source of truth.
    location /api/ {
        proxy_pass https://netguard-api-oan9.onrender.com;
        proxy_ssl_server_name on;
        proxy_ssl_name netguard-api-oan9.onrender.com;
        proxy_set_header Host netguard-api-oan9.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 35s;
    }

    location = /health {
        proxy_pass https://netguard-api-oan9.onrender.com/health;
        proxy_ssl_server_name on;
        proxy_ssl_name netguard-api-oan9.onrender.com;
        proxy_set_header Host netguard-api-oan9.onrender.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
