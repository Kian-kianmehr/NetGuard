name: NetGuard IODA collection

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: netguard-ioda-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect IODA signals for Iran
        env:
          SUPABASE_URL: https://fsglerccgxktvcpybuzk.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NETGUARD_COUNTRY_CODE: IR
          IODA_LOOKBACK_HOURS: "4"
          IODA_MAX_POINTS: "240"
        run: python scripts/collect_ioda.py
